name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres-user:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: userservice
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-job:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobservice
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install and test user-service
        working-directory: user-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/userservice
          JWT_SECRET: bitwarden
          REDIS_HOST: localhost
        run: |
          npm install
          npx prisma migrate deploy
          npm test

      - name: Install and test job-service
        working-directory: job-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/jobservice
          JWT_SECRET: bitwarden
          REDIS_HOST: localhost
          USER_SERVICE_URL: http://localhost:3001
        run: |
          npm install
          npx prisma migrate deploy
          npm test